name: Windows Cloud PC - AnyDesk Optimized

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Downloading & Installing Essentials
        run: |
          # Baixa o seu instalador do Dropbox
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile "Downloads.bat"
          cmd /c Downloads.bat

      - name: Abrir Google Roblox Studio
        run: |
          # Abre o navegador na pesquisa solicitada
          Start-Process "https://www.google.com/search?q=roblox+studio"

      - name: Log In To AnyDesk
        run: |
          # Verifica e inicia o AnyDesk
          if (Test-Path "start.bat") {
            cmd /c start.bat
          } else {
            Write-Host "Arquivo start.bat nao encontrado. Criando um basico..."
            # Se o start.bat nao existir, ele tenta rodar o AnyDesk diretamente
            Start-Process "AnyDesk.exe"
          }

      - name: Monitor and Keep Alive
        run: |
          # Mantem a maquina ligada por muito tempo
          while ($true) {
            Write-Host "PC Ativo... Verifique seu AnyDesk."
            Start-Sleep -Seconds 600
          }
